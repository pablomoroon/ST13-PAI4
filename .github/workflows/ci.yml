
name: PAI4 - DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    name: DAST - ZAP y Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      ZAP_GATE_MIN_RISK: "3"

    steps:

      # 1. DESCARGAR REPOSITORIO
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. PREPARAR RED DOCKER
      - name: Preparar red Docker
        run: |
          docker network create pai4-net

      # 3. CONSTRUIR JUICE SHOP
      - name: Construir imagen Docker de Juice Shop
        run: |
          test -f Dockerfile
          test -f package.json

          docker build \
            --tag pai4-juice-shop:ci \
            --file Dockerfile \
            .

          echo "Imagen Docker construida correctamente"

      # 4. INICIAR JUICE SHOP
      - name: Iniciar Juice Shop
        run: |
          docker run -d --rm \
            --name pai4-juice-shop \
            --network pai4-net \
            -p 127.0.0.1:3000:3000 \
            pai4-juice-shop:ci

      # 5. COMPROBAR DISPONIBILIDAD
      - name: Esperar a Juice Shop
        run: |
          for intento in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              echo "Juice Shop funcionando correctamente"
              exit 0
            fi

            sleep 3
          done

          echo "ERROR: Juice Shop no responde"
          docker logs pai4-juice-shop || true
          exit 1

      # 6. EJECUTAR OWASP ZAP
      - name: Ejecutar ZAP con alcance limitado
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports

          test -f zap-plan.yaml

          cp zap-plan.yaml zap-reports/zap-plan.yaml

          set +e

          docker run --rm \
            --network pai4-net \
            -v "$PWD/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/zap-plan.yaml \
            2>&1 | tee zap-reports/zap-console.log

          resultado=${PIPESTATUS[0]}
          set -e

          echo "Codigo de salida ZAP: $resultado"

          # 0: correcto
          # 1: error del plan
          # 2: advertencias
          if [ "$resultado" -ne 0 ] && [ "$resultado" -ne 2 ]; then
            echo "ERROR: ZAP no termino correctamente"
            exit 1
          fi

          # Comprobar los tres informes
          test -s zap-reports/zap-report.json
          test -s zap-reports/zap-report.html
          test -s zap-reports/zap-report.xml

          # Validar XML para DefectDojo
          python3 - <<'PYXML'
          from pathlib import Path
          from xml.etree import ElementTree as ET

          ruta = Path("zap-reports/zap-report.xml")
          raiz = ET.parse(ruta).getroot()

          if raiz.tag != "OWASPZAPReport":
              raise SystemExit(
                  f"ERROR: Formato XML inesperado: {raiz.tag}"
              )

          if not raiz.findall("site"):
              raise SystemExit(
                  "ERROR: XML de ZAP sin sitios analizados"
              )

          print("XML tradicional de ZAP verificado")
          PYXML

          echo "Informes JSON, HTML y XML generados"

      # 7. COMPROBAR ALCANCE DEL ANALISIS
      - name: Verificar alcance del informe ZAP
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit

          ruta = Path("zap-reports/zap-report.json")

          datos = json.loads(
              ruta.read_text(encoding="utf-8")
          )

          sitios = datos.get("site", [])

          if not sitios:
              raise SystemExit(
                  "ERROR: El informe ZAP no contiene sitios"
              )

          total_alertas = 0

          def comprobar_url(url):
              parsed = urlsplit(url)

              if not (
                  parsed.scheme == "http"
                  and parsed.hostname == "pai4-juice-shop"
                  and parsed.port == 3000
              ):
                  raise SystemExit(
                      f"ERROR: URL fuera de alcance: {url}"
                  )

          for sitio in sitios:
              comprobar_url(sitio.get("@name", ""))

              for alerta in sitio.get("alerts", []):
                  total_alertas += 1

                  for instancia in alerta.get(
                      "instances", []
                  ):
                      comprobar_url(
                          instancia.get("uri", "")
                      )

          mensaje = (
              "ALCANCE VALIDADO\n"
              "Objetivo: http://pai4-juice-shop:3000\n"
              f"Tipos de alertas: {total_alertas}\n"
              "Todos los hallazgos del informe "
              "pertenecen a Juice Shop.\n"
          )

          print(mensaje)

          Path(
              "zap-reports/alcance-resultado.txt"
          ).write_text(
              mensaje,
              encoding="utf-8"
          )
          PY

      # 8. QUALITY GATE BLOQUEANTE
      - name: Evaluar Quality Gate
        run: |
          python3 scripts/evaluar_gate_zap.py

      # 9. GUARDAR LOGS
      - name: Guardar logs de Juice Shop
        if: always()
        run: |
          mkdir -p evidencias

          docker logs pai4-juice-shop \
            > evidencias/juice-shop.log 2>&1 || true

      # 10. GUARDAR INFORMES Y EVIDENCIAS
      - name: Subir evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-dast-quality-gate
          path: |
            zap-reports/
            evidencias/
          if-no-files-found: warn
          retention-days: 30

      # 11. LIMPIAR CONTENEDORES
      - name: Limpiar contenedores
        if: always()
        run: |
          docker rm -f pai4-juice-shop || true
          docker network rm pai4-net || true

  defectdojo:
    name: Importar resultados en DefectDojo
    needs: dast
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, defectdojo]
    timeout-minutes: 10

    steps:
      - name: Descargar evidencias DAST
        uses: actions/download-artifact@v4
        with:
          name: evidencias-dast-quality-gate
          path: evidencias-dast-quality-gate

      - name: Comprobar informe XML
        run: |
          test -s evidencias-dast-quality-gate/zap-reports/zap-report.xml
          echo "Informe XML encontrado"

      - name: Importar análisis en DefectDojo
        env:
          DD_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
          DD_URL: http://localhost:8080
        run: |
          set -euo pipefail

          if [ -z "$DD_API_KEY" ]; then
            echo "ERROR: No se ha configurado DEFECTDOJO_API_KEY"
            exit 1
          fi

          TEST_TITLE="PAI4 - ZAP - Run ${GITHUB_RUN_NUMBER} - Attempt ${GITHUB_RUN_ATTEMPT} - ${GITHUB_SHA:0:7}"

          curl --fail-with-body -sS -X POST \
            "${DD_URL}/api/v2/import-scan/" \
            -H "Authorization: Token ${DD_API_KEY}" \
            -F "scan_type=ZAP Scan" \
            -F "engagement=1" \
            -F "test_title=${TEST_TITLE}" \
            -F "file=@evidencias-dast-quality-gate/zap-reports/zap-report.xml" \
            -o respuesta-defectdojo.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          respuesta = json.loads(
              Path("respuesta-defectdojo.json").read_text()
          )

          test_id = respuesta.get("test_id")

          if not test_id:
              raise SystemExit(
                  "ERROR: DefectDojo no ha devuelto un test_id válido"
              )

          print(f"Importación correcta. Test ID: {test_id}")
          print(f"Hallazgos importados: {respuesta.get('statistics', {}).get('after', {}).get('total', {}).get('total', 'No disponible')}")
          PY
