
env:
  contexts:
    - name: juice-shop
      urls:
        - http://pai4-juice-shop:3000
      includePaths:
        - 'http://pai4-juice-shop:3000(?:/.*)?'
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      scanOnlyInScope: true
      maxAlertsPerRule: 10

  - type: spider
    parameters:
      context: juice-shop
      maxDuration: 2

  - type: spiderClient
    parameters:
      context: juice-shop
      maxDuration: 2
      numberOfBrowsers: 1
      scopeCheck: Strict

  - type: passiveScan-wait
    parameters:
      maxDuration: 2

  - type: activeScan
    parameters:
      context: juice-shop
      maxScanDurationInMins: 8
      maxRuleDurationInMins: 2

  - type: passiveScan-wait
    parameters:
      maxDuration: 2

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-report.json
      reportTitle: PAI4 DAST Juice Shop
    sites:
      - http://pai4-juice-shop:3000

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: zap-report.html
      reportTitle: PAI4 DAST Juice Shop
    sites:
      - http://pai4-juice-shop:3000
