
name: PAI4 - DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    name: DAST - ZAP y Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      ZAP_GATE_MIN_RISK: "3"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar red Docker
        run: docker network create pai4-net

      - name: Iniciar Juice Shop
        run: |
          docker run -d --rm \
            --name pai4-juice-shop \
            --network pai4-net \
            -p 127.0.0.1:3000:3000 \
            bkimminich/juice-shop:v20.4.0

      - name: Esperar a Juice Shop
        run: |
          for intento in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              echo "Juice Shop funcionando"
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Ejecutar ZAP Full Scan
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports

          set +e

          docker run --rm \
            --network pai4-net \
            -v "$PWD/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t http://pai4-juice-shop:3000 \
            -m 2 \
            -j \
            -J zap-report.json \
            -r zap-report.html \
            -I \
            -z "-config scanner.maxScanDurationInMins=8 -config scanner.maxRuleDurationInMins=2" \
            2>&1 | tee zap-reports/zap-console.log

          resultado=${PIPESTATUS[0]}

          set -e

          echo "Codigo de salida ZAP: $resultado"

          if [ "$resultado" -ne 0 ]; then
            echo "ERROR: El analisis ZAP no termino correctamente"
            exit 1
          fi

          test -s zap-reports/zap-report.json

      - name: Evaluar Quality Gate
        run: |
          python3 scripts/evaluar_gate_zap.py

      - name: Guardar logs de Juice Shop
        if: always()
        run: |
          mkdir -p evidencias
          docker logs pai4-juice-shop \
            > evidencias/juice-shop.log 2>&1 || true

      - name: Subir evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-dast-quality-gate
          path: |
            zap-reports/
            evidencias/
          if-no-files-found: warn

      - name: Limpiar contenedores
        if: always()
        run: |
          docker rm -f pai4-juice-shop || true
          docker network rm pai4-net || true
