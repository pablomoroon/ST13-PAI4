
name: PAI4 - DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast:
    name: DAST - ZAP y Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      ZAP_GATE_MIN_RISK: "3"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar red Docker
        run: docker network create pai4-net

      - name: Iniciar Juice Shop
        run: |
          docker run -d --rm \
            --name pai4-juice-shop \
            --network pai4-net \
            -p 127.0.0.1:3000:3000 \
            bkimminich/juice-shop:v20.4.0

      - name: Esperar a Juice Shop
        run: |
          for intento in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              echo "Juice Shop funcionando"
              exit 0
            fi
            sleep 3
          done
          exit 1

       - name: Ejecutar ZAP con alcance limitado
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports

          cp zap-plan.yaml zap-reports/zap-plan.yaml

          set +e

          docker run --rm \
            --network pai4-net \
            -v "$PWD/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -cmd -autorun /zap/wrk/zap-plan.yaml \
            2>&1 | tee zap-reports/zap-console.log

          resultado=${PIPESTATUS[0]}

          set -e

          echo "Codigo de salida ZAP: $resultado"

          # 2 significa advertencias no bloqueantes.
          if [ "$resultado" -ne 0 ] && [ "$resultado" -ne 2 ]; then
            echo "ERROR: Fallo tecnico en ZAP"
            exit 1
          fi

          test -s zap-reports/zap-report.json
          test -s zap-reports/zap-report.html


      - name: Verificar alcance del informe ZAP
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit

          ruta = Path("zap-reports/zap-report.json")
          datos = json.loads(ruta.read_text(encoding="utf-8"))

          sitios = datos.get("site", [])
          assert sitios, "El informe no contiene sitios"

          for sitio in sitios:
              url = sitio.get("@name", "")
              parsed = urlsplit(url)

              assert (
                  parsed.scheme == "http"
                  and parsed.hostname == "pai4-juice-shop"
                  and parsed.port == 3000
              ), f"Sitio no autorizado en el informe: {url}"

              for alerta in sitio.get("alerts", []):
                  for instancia in alerta.get("instances", []):
                      uri = instancia.get("uri", "")
                      origen = urlsplit(uri)
                      assert (
                          origen.scheme == "http"
                          and origen.hostname == "pai4-juice-shop"
                          and origen.port == 3000
                      ), f"Hallazgo fuera del alcance: {uri}"

          mensaje = (
              "ALCANCE VALIDADO\n"
              "Todos los sitios y hallazgos del informe "
              "pertenecen a Juice Shop.\n"
          )

          print(mensaje)

          Path("zap-reports/alcance-resultado.txt").write_text(
              mensaje, encoding="utf-8"
          )
          PY


      - name: Evaluar Quality Gate
        run: |
          python3 scripts/evaluar_gate_zap.py

      - name: Guardar logs de Juice Shop
        if: always()
        run: |
          mkdir -p evidencias
          docker logs pai4-juice-shop \
            > evidencias/juice-shop.log 2>&1 || true

      - name: Subir evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-dast-quality-gate
          path: |
            zap-reports/
            evidencias/
          if-no-files-found: warn

      - name: Limpiar contenedores
        if: always()
        run: |
          docker rm -f pai4-juice-shop || true
          docker network rm pai4-net || true
